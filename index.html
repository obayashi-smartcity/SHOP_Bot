<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<title>みんまちSHOP サポート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   みんまちSHOP サポートロボ
   - 構造：ChatBot/bot2.html（キャラ大表示・会話ウィンドウ・文字送り・選択肢・ログ）
   - デザイン：shop.machiapps.com に合わせたグリーン × ネイビーのトーン
   ========================================================= */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --green: #009e34;         /* 主色（サイトのメインボタン） */
  --green-2: #26a65b;       /* 見出し・リンク */
  --green-deep: #007b1c;
  --green-mid: #73c982;
  --green-soft: #d7f4db;    /* ログインボタンの淡いグリーン */
  --green-pale: #ebf7ed;
  --navy: #142c4b;          /* フッター・STEPバッジ */
  --navy-2: #123e6b;
  --blue: #3184d6;          /* ロゴ「みんまち」・サブボタン */
  --ink: #272b30;
  --ink-2: #4f575e;
  --muted: #8a9096;
  --line: #e3e7e4;
  --bg-gray: #f7f7f7;
  --danger: #d6343a;
  --sans: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, system-ui, sans-serif;
  --radius: 6px;
  --ease: cubic-bezier(.22,.61,.36,1);
  --pop: cubic-bezier(.34,1.56,.64,1);
}
html, body {
  height: 100%; overflow: hidden; overscroll-behavior: none;
  background: #fff; color: var(--ink);
  font-family: var(--sans); font-size: 14px; line-height: 1.8;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  touch-action: manipulation;
}
button, textarea { font-family: inherit; -webkit-tap-highlight-color: transparent; color: inherit; }
button { cursor: pointer; background: none; border: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 全体（iPhoneのキーボードに追従） ---------- */
.game {
  position: fixed; left: 0; right: 0; top: 0;
  height: 100vh; height: 100dvh; height: var(--app-h, 100dvh);
  max-width: 600px; margin: 0 auto;
  display: flex; flex-direction: column; overflow: hidden;
}

/* ---------- 背景：サイトのヒーローと同じ淡いグリーンのウェーブ ---------- */
.scene { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; background: #fff; }
.scene .wave { position: absolute; left: 50%; width: max(100vw, 1000px); max-width: none; transform: translateX(-50%); }
.scene .wave.w1 { top: 20%; height: 240px; }
.scene .wave.w2 { top: 27%; height: 240px; }
.scene .base { position: absolute; left: 0; right: 0; top: calc(27% + 220px); bottom: 0; background: var(--green-pale); }
.ghost { position: absolute; left: 50%; top: 9%; transform: translateX(-50%); font-family: var(--sans); font-weight: 300;
  font-size: clamp(64px, 16vw, 150px); letter-spacing: .02em; line-height: 1; color: #f1f3f2; white-space: nowrap; user-select: none; }
.deco { position: absolute; border-radius: 50%; }
.deco.d1 { width: 14px; height: 14px; background: var(--green-mid); top: 36%; right: 7%; opacity: .7; }
.deco.d2 { width: 9px; height: 9px; background: #f7c948; top: 27%; right: 10%; }
.deco.d3 { width: 22px; height: 22px; border: 2px solid var(--blue); top: 44%; left: 5%; opacity: .5; }

/* ---------- ヘッダー ---------- */
.hud { position: relative; z-index: 20; background: #fff; }
.hud-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) 16px 8px; }
.logo { display: flex; align-items: center; gap: 10px; min-width: 0; }
.wordmark { display: flex; align-items: flex-end; font-weight: 900; font-size: 1.25rem; line-height: 1; letter-spacing: .02em; white-space: nowrap; }
.wordmark .wm-a { color: var(--blue); font-size: .82em; margin-right: 1px; }
.wordmark .wm-b { color: var(--green-2); font-family: "Noto Sans JP", sans-serif; letter-spacing: -.01em; }
.wordmark svg { width: 26px; height: 18px; margin: 0 0 3px 2px; }
.logo-sub { font-size: .66rem; font-weight: 700; color: var(--ink-2); border-left: 1px solid var(--line); padding-left: 10px; line-height: 1.3; white-space: nowrap; }
.status-sub { display: flex; align-items: center; gap: 5px; font-weight: 500; color: var(--green-2); }
.status-sub::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.game.is-thinking .status-sub { color: var(--blue); }
.game.is-thinking .status-sub::before { background: var(--blue); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.hud-btns { display: flex; gap: 6px; flex-shrink: 0; }
.icon-btn { height: 34px; padding: 0 12px; display: flex; align-items: center; gap: 5px; border-radius: var(--radius);
  font-weight: 700; font-size: .72rem; color: var(--green-deep); background: var(--green-soft); box-shadow: inset 0 -3px 0 rgba(0,123,28,.12);
  transition: background .2s, transform .1s; }
.icon-btn svg { width: 14px; height: 14px; }
@media (hover: hover) { .icon-btn:hover { background: #c6edcc; } }
.icon-btn:active { transform: translateY(1px); }
.icon-btn:disabled { opacity: .4; cursor: default; }
.notice-bar { margin: 0 16px; background: var(--bg-gray); text-align: center; font-size: .62rem; font-weight: 700; color: var(--ink-2); padding: 3px 8px; line-height: 1.6; }

/* ---------- ステージ（ロボット） ---------- */
.stage { position: relative; z-index: 5; flex: 1; min-height: 0; display: flex; align-items: flex-end; justify-content: center; }
.stage-label { position: absolute; left: 18px; top: 14px; line-height: 1.3; }
.stage-label strong { display: block; font-weight: 300; font-size: 1.9rem; color: var(--ink); letter-spacing: .04em; }
.stage-label span { display: block; font-weight: 700; font-size: .8rem; color: var(--green-2); margin-top: 2px; }
.chara { position: relative; height: 100%; max-height: 360px; aspect-ratio: 200 / 300; display: flex; align-items: flex-end; justify-content: center;
  padding-top: 14px; margin-bottom: -16px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.chara svg { height: 100%; width: auto; max-width: 72vw; display: block; overflow: visible; transform-origin: 50% 100%; animation: hover 3.6s ease-in-out infinite; }
.chara::after { content: ""; position: absolute; bottom: 18px; left: 50%; width: 40%; height: 12px; transform: translateX(-50%);
  border-radius: 50%; background: rgba(20,44,75,.14); filter: blur(4px); z-index: -1; animation: shadow 3.6s ease-in-out infinite; }
@keyframes hover { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes shadow { 0%,100% { transform: translateX(-50%) scale(1); opacity: 1; } 50% { transform: translateX(-50%) scale(.82); opacity: .6; } }
.game.is-thinking .chara svg { animation: tilt 1.4s ease-in-out infinite; }
@keyframes tilt { 0%,100% { transform: rotate(-3deg) translateY(-4px); } 50% { transform: rotate(3deg) translateY(-8px); } }
.game.is-happy .chara svg { animation: hop .55s var(--ease) 2; }
@keyframes hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-24px); } }
.game.is-error .chara svg { animation: shake .42s ease-in-out 2; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px) rotate(-3deg); } 75% { transform: translateX(8px) rotate(3deg); } }

/* キャラクターの部品（色はここで管理） */
.rb-line { fill: none; stroke: var(--navy); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.rb-line-g { fill: none; stroke: #c3c9d1; stroke-width: 4; stroke-linecap: round; }
.rb-shell { fill: #fff; stroke: var(--navy); stroke-width: 3; stroke-linejoin: round; }
.rb-gray { fill: #c3c9d1; stroke: var(--navy); stroke-width: 3; }
.rb-brim { fill: none; stroke: #9aa3ad; stroke-width: 3.5; stroke-linecap: round; }
.rb-suit { fill: #4a5059; stroke: var(--navy); stroke-width: 3; stroke-linejoin: round; }
.rb-band { fill: none; stroke: #4a5059; stroke-width: 5; stroke-linecap: round; }
.rb-limb-o { fill: none; stroke: var(--navy); stroke-width: 17; stroke-linecap: round; }
.rb-limb { fill: none; stroke: #fff; stroke-width: 11; stroke-linecap: round; }
.rb-finger-o { fill: none; stroke: var(--navy); stroke-width: 14; stroke-linecap: round; }
.rb-finger { fill: none; stroke: #fff; stroke-width: 8; stroke-linecap: round; }
.rb-red { fill: #e5383b; stroke: #a61e24; stroke-width: 1.2; stroke-linejoin: round; }
.rb-craft { fill: #22262c; stroke: var(--navy); stroke-width: 3; }
.rb-craft-top { fill: #3a3f47; stroke: var(--navy); stroke-width: 3; }
.rb-yellow { fill: #ffd23f; stroke: #c99a00; stroke-width: 1.5; }
.rb-lights { animation: lights 2.4s ease-in-out infinite; }
@keyframes lights { 0%,100% { opacity: 1; } 50% { opacity: .7; } }
.rb-thrust { fill: #9fe3ff; opacity: .55; animation: thrust 1.2s ease-in-out infinite; }
@keyframes thrust { 0%,100% { opacity: .55; } 50% { opacity: .25; } }
.rb-skin { fill: #ffe2cc; stroke: var(--navy); stroke-width: 3; }
.rb-hair { fill: #8a5532; stroke: #5a361f; stroke-width: 2; stroke-linejoin: round; }
.rb-pupil { fill: #1d1a24; }
.rb-brow { fill: none; stroke: #5a3a28; stroke-width: 3.5; stroke-linecap: round; transition: transform .2s; }
.game.is-thinking .rb-brow, .game.is-happy .rb-brow { transform: translateY(-3px); }
.rb-eyewhite { fill: #fff; stroke: #1d1a24; stroke-width: 3; }
.rb-eye-line { fill: none; stroke: #2a2233; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.rb-mouth-in { fill: #c8457a; stroke: var(--navy); stroke-width: 2.5; stroke-linejoin: round; }
.rb-tongue { fill: #ff9cbc; }
.rb-dark { fill: var(--navy); }
.rb-accent { fill: var(--green); }
.rb-ring { fill: var(--green-mid); }
.rb-glow { fill: #fff; }
.rb-led { fill: var(--green-soft); }
.rb-cheek { fill: #ff9db1; opacity: .8; }
.rb-antenna { animation: antenna 2.4s ease-in-out infinite; }
@keyframes antenna { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
.game.is-thinking .rb-antenna { animation-duration: .5s; fill: var(--blue); }
.rb-eyes > g { display: none; }
.rb-eyes .eyes-normal { display: inline; }
.eyes-normal .eye { transform-box: fill-box; transform-origin: center; animation: blinkEye 5s infinite; }
@keyframes blinkEye { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.game.is-happy .rb-eyes .eyes-normal, .game.is-thinking .rb-eyes .eyes-normal, .game.is-error .rb-eyes .eyes-normal { display: none; }
.game.is-happy .rb-eyes .eyes-happy { display: inline; }
.game.is-thinking .rb-eyes .eyes-think { display: inline; }
.game.is-error .rb-eyes .eyes-error { display: inline; }
.eyes-think { animation: look 1.6s ease-in-out infinite; }
@keyframes look { 0%,100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
.rb-mouth { transform-box: fill-box; transform-origin: 50% 0%; }
.game.is-talking .rb-mouth { animation: speak .16s ease-in-out infinite alternate; }
@keyframes speak { from { transform: scaleY(.55); } to { transform: scaleY(1.1); } }
.game.is-error .rb-mouth { transform: scaleY(.45); }
.rb-arm-r { transform-box: view-box; transform-origin: 88px 182px; animation: greet 2.8s ease-in-out infinite; }
@keyframes greet { 0%,70%,100% { transform: rotate(0); } 78%,92% { transform: rotate(-10deg); } 85% { transform: rotate(4deg); } }
.game.is-happy .rb-arm-r { animation: wave .28s ease-in-out 4 alternate; }
@keyframes wave { from { transform: rotate(-16deg); } to { transform: rotate(5deg); } }

/* 考え中の吹き出し */
.think-tag { position: absolute; top: 18%; right: 16px; z-index: 6; display: none; align-items: center; gap: 8px;
  background: #fff; color: var(--navy); border: 1.6px solid var(--navy); border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: .72rem;
  box-shadow: 0 6px 16px -8px rgba(20,44,75,.4); }
.think-tag::after { content: ""; position: absolute; left: 14px; bottom: -6px; width: 9px; height: 9px; background: #fff; border-right: 1.6px solid var(--navy); border-bottom: 1.6px solid var(--navy); transform: rotate(45deg); }
.game.is-thinking .think-tag { display: inline-flex; animation: popIn .3s var(--pop); }
.dots { display: inline-flex; gap: 4px; align-items: center; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: blink 1.4s infinite ease-in-out both; }
.dots i:nth-child(1) { animation-delay: -.32s; } .dots i:nth-child(2) { animation-delay: -.16s; }
@keyframes blink { 0%,80%,100% { transform: scale(.4); opacity: .3; } 40% { transform: scale(1); opacity: 1; } }
@keyframes popIn { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes slideIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- 会話ウィンドウ ---------- */
.dialog-area { position: relative; z-index: 10; padding: 0 14px; }
.player-line { display: flex; justify-content: flex-end; margin: 0 0 10px; }
.player-line span { max-width: 86%; background: var(--green); color: #fff; font-weight: 500; font-size: .84rem; line-height: 1.55; padding: 7px 14px;
  border-radius: 14px 14px 4px 14px; box-shadow: 0 4px 12px -6px rgba(0,158,52,.6);
  overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all;
  animation: slideIn .3s var(--ease); }
.player-line[hidden] { display: none; }
.dialog { position: relative; background: #fff; border-radius: 10px; padding: 26px 18px 16px; margin-top: 14px;
  box-shadow: 0 2px 0 rgba(20,44,75,.04), 0 14px 34px -12px rgba(20,44,75,.28); }
.dialog.error { box-shadow: 0 0 0 2px #f3b9bb, 0 14px 34px -12px rgba(150,30,30,.3); }
.nametag { position: absolute; top: -13px; left: 16px; display: inline-flex; align-items: center; gap: 6px;
  background: var(--green); color: #fff; border-radius: 999px; padding: 2px 14px 2px 10px; font-weight: 700; font-size: .76rem; line-height: 1.8;
  box-shadow: 0 3px 8px -3px rgba(0,158,52,.6); }
.nametag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; }
.dialog.error .nametag { background: var(--danger); box-shadow: none; }
.dialog-scroll { max-height: calc(var(--app-h, 100dvh) * .34); min-height: 52px; overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch; font-size: .95rem; line-height: 1.85; padding-right: 4px; }
.dialog-scroll::-webkit-scrollbar { width: 4px; } .dialog-scroll::-webkit-scrollbar-thumb { background: var(--green-soft); border-radius: 4px; }
.dialog-scroll .greet { font-weight: 700; font-size: 1.12rem; line-height: 1.6; color: var(--ink); }
.dialog-scroll .greet em { font-style: normal; color: var(--green-2); }
.dialog-scroll .sub { font-size: .8rem; color: var(--muted); margin-top: 4px; }
.dialog-scroll .err { color: var(--danger); font-weight: 500; }
.next { position: absolute; right: 16px; bottom: 8px; width: 0; height: 0; border-style: solid; border-width: 8px 6px 0;
  border-color: var(--green) transparent transparent; opacity: 0; }
.dialog.done .next { opacity: 1; animation: nextBob .8s ease-in-out infinite; }
@keyframes nextBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
.cursor { display: inline-block; width: 2px; height: 1em; background: var(--green); vertical-align: -.15em; margin-left: 1px; animation: caret .7s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }

/* 回答のMarkdown */
.md p { margin: 0 0 10px; }
.md p:last-child { margin-bottom: 0; }
.md .h { font-weight: 700; color: var(--green-2); margin: 14px 0 4px; padding-left: 10px; border-left: 3px solid var(--green); line-height: 1.5; }
.md strong { font-weight: 700; background: linear-gradient(transparent 62%, var(--green-soft) 62%); }
.md ul, .md ol { margin: 4px 0 10px; padding-left: 1.3em; }
.md li { margin: 3px 0; }
.md li.pending { visibility: hidden; }
.md li::marker { color: var(--green); font-weight: 700; }
.md code { background: var(--green-pale); color: var(--green-deep); border-radius: 4px; padding: 1px 5px; font-size: .88em; }
.md blockquote { margin: 6px 0 10px; padding: 6px 12px; border-left: 3px solid var(--green-mid); background: var(--green-pale); border-radius: 0 6px 6px 0; color: var(--ink-2); font-size: .88rem; }
.table-wrap { overflow-x: auto; margin: 6px 0 12px; border-radius: var(--radius); border: 1px solid var(--line); }
.md table { border-collapse: collapse; font-size: .8rem; width: 100%; min-width: 280px; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
.md tr:last-child td { border-bottom: none; }
.md th { background: var(--green-pale); color: var(--green-deep); font-weight: 700; white-space: nowrap; }
.notice { font-size: .76rem; color: #7a5d12; background: #fff8e1; border-radius: var(--radius); padding: 6px 10px; margin-top: 10px; }

/* 参照元 */
.extra { animation: slideIn .35s var(--ease); }
details.sources { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 10px; }
details.sources summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
details.sources summary::-webkit-details-marker { display: none; }
.src-label { font-weight: 700; font-size: .74rem; color: var(--green-2); margin-right: 2px; display: inline-flex; align-items: center; gap: 5px; }
.src-label::before { content: "+"; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--green); color: #fff; font-size: .8rem; line-height: 1; }
details.sources[open] .src-label::before { content: "−"; }
.doc-tag { background: var(--bg-gray); border-radius: 999px; padding: 0 10px; font-size: .7rem; color: var(--ink-2); }
.src { margin-top: 12px; }
.src-title { font-weight: 700; font-size: .8rem; color: var(--navy); }
.src-title a { color: var(--green-2); margin-left: 8px; font-weight: 500; font-size: .72rem; }
.excerpt { margin: 6px 0 0; padding: 8px 12px; background: var(--bg-gray); border-left: 3px solid var(--green-mid); border-radius: 0 6px 6px 0; font-size: .76rem; color: var(--ink-2); white-space: pre-wrap; max-height: 7.4em; overflow: hidden; }
.excerpt.expanded { max-height: none; }
.more { font-size: .72rem; color: var(--green-2); padding: 2px 0; }
.no-src { font-size: .72rem; color: var(--muted); margin-top: 10px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; font-size: .7rem; color: var(--muted); }
.meta .spacer { flex: 1; }
.meta button { font-size: .7rem; font-weight: 500; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); }
@media (hover: hover) { .meta button:hover { border-color: var(--green); color: var(--green); } }

/* ---------- 選択肢（サイトの「ログイン」ボタン風） ---------- */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.choices[hidden] { display: none; }
.choice { position: relative; display: flex; align-items: center; gap: 8px; text-align: left; background: var(--green-soft); color: var(--green-deep);
  border-radius: var(--radius); padding: 9px 10px; min-height: 52px; font-weight: 700; font-size: .78rem; line-height: 1.45;
  box-shadow: inset 0 -3px 0 rgba(0,123,28,.14); transition: background .2s, color .2s, transform .1s;
  animation: choiceIn .4s var(--pop) both; }
.choice .num { flex-shrink: 0; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: #fff; font-size: .68rem; font-weight: 700; }
.choice:nth-child(2) { animation-delay: .05s; } .choice:nth-child(3) { animation-delay: .1s; } .choice:nth-child(4) { animation-delay: .15s; }
@media (hover: hover) { .choice:hover { background: var(--green); color: #fff; } }
.choice:active { transform: translateY(2px); box-shadow: none; }
.choice:disabled { opacity: .45; cursor: default; }
@keyframes choiceIn { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
.retry { margin-top: 12px; border: 1.6px solid var(--danger); color: var(--danger); background: #fff; border-radius: var(--radius); padding: 7px 18px; min-height: 40px; font-weight: 700; font-size: .78rem; }
.retry:active, .retry:hover { background: var(--danger); color: #fff; }

/* ---------- 入力バー ---------- */
.input-bar { position: relative; z-index: 10; padding: 14px 14px calc(10px + env(safe-area-inset-bottom)); }
.composer { display: flex; gap: 6px; align-items: flex-end; background: #fff; border: 1.6px solid var(--green); border-radius: 10px; padding: 4px 4px 4px 14px;
  box-shadow: 0 8px 20px -12px rgba(20,44,75,.3); transition: box-shadow .2s; }
.composer:focus-within { box-shadow: 0 0 0 3px var(--green-soft); }
.composer textarea { flex: 1; resize: none; border: none; outline: none; background: transparent; color: var(--ink);

      if (RE_QUOTE.test(l)) {
        items = [];
        while (i < lines.length && (m = lines[i].match(RE_QUOTE))) { items.push(inlineMd(esc(m[1]))); i++; }
        html += '<blockquote>' + items.join('<br>') + '</blockquote>'; continue;
      }
      var buf = [inlineMd(esc(l.trim()))]; i++;
      while (i < lines.length && lines[i].trim() && !startsBlock(lines, i)) { buf.push(inlineMd(esc(lines[i].trim()))); i++; }
      html += '<p>' + buf.join('<br>') + '</p>';
    }
    return html;
  }
  function safeHttpsUrl(u) {
    return (typeof u === 'string' && /^https:\/\/[^\s"'<>]+$/.test(u)) ? u : '';
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // ===== ロボットの状態 =====
  var moodTimer = null;
  function setMood(mood, ms) {
    clearTimeout(moodTimer);
    els.game.classList.remove('is-happy', 'is-error', 'is-thinking', 'is-talking');
    if (mood && mood !== 'idle') els.game.classList.add('is-' + mood);
    els.statusState.textContent = mood === 'thinking' ? '回答を作成中' : 'オンライン';
    if (ms) moodTimer = setTimeout(function () { setMood('idle'); }, ms);
  }

  // ===== 文字送り（タイプライター） =====
  function stopTyping(finish) {
    var t = state.typing;
    if (!t) return;
    clearInterval(t.timer);
    if (finish) t.nodes.forEach(function (n, i) { n.nodeValue = t.texts[i]; });
    (t.pend || []).forEach(function (p) { p.li.classList.remove('pending'); });
    if (t.cursor && t.cursor.parentNode) t.cursor.remove();
    state.typing = null;
    els.game.classList.remove('is-talking');
    els.dialog.classList.add('done');
    if (t.onDone) t.onDone();
  }
  function typeInto(container, html, onDone) {
    stopTyping(true);
    els.dialog.classList.remove('done');
    container.innerHTML = html;
    var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
    var nodes = [], texts = [], total = 0, n;
    while ((n = walker.nextNode())) { nodes.push(n); texts.push(n.nodeValue); total += n.nodeValue.length; n.nodeValue = ''; }
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var pend = Array.prototype.map.call(container.querySelectorAll('li'), function (li) { li.classList.add('pending'); return { li: li }; });
    var t = { nodes: nodes, texts: texts, onDone: onDone, cursor: el('span', 'cursor'), pend: pend };
    state.typing = t;
    if (reduce || !total) { stopTyping(true); return; }
    var step = Math.max(1, Math.ceil(total / 140));   // 長い回答でも約4秒以内に表示しきる
    var ni = 0, ci = 0;
    els.game.classList.add('is-talking');
    t.timer = setInterval(function () {
      var k = step;
      while (k > 0 && ni < nodes.length) {
        var full = texts[ni], take = Math.min(k, full.length - ci);
        ci += take; k -= take;
        nodes[ni].nodeValue = full.slice(0, ci);
        if (ci >= full.length) { ni++; ci = 0; }
      }
      for (var j = 0; j < pend.length; j++) { if (pend[j].li.textContent.length) { pend[j].li.classList.remove('pending'); pend.splice(j--, 1); } }
      var cur = nodes[Math.min(ni, nodes.length - 1)];
      if (cur && cur.parentNode) cur.parentNode.insertBefore(t.cursor, cur.nextSibling);
      if (ni >= nodes.length) { stopTyping(false); return; }
      var sc = els.dialogScroll;
      if (sc.scrollHeight - sc.scrollTop - sc.clientHeight < 60) sc.scrollTop = sc.scrollHeight;
    }, 28);
  }

  // ===== 会話ウィンドウ =====
  function setDialogError(isErr) {
    els.dialog.classList.toggle('error', !!isErr);
    els.nametag.textContent = isErr ? 'エラー' : CHARA_NAME;
  }
  function showPlayerLine(text) {
    if (!text) { els.playerLine.hidden = true; return; }
    els.playerText.textContent = text;
    els.playerLine.hidden = false;
    var s = els.playerText; s.style.animation = 'none'; void s.offsetWidth; s.style.animation = '';
  }
  function renderChoices(list) {
    els.choices.innerHTML = '';
    if (!list || !list.length) { els.choices.hidden = true; return; }
    list.forEach(function (q, i) {
      var c = el('button', 'choice');
      c.type = 'button';
      c.appendChild(el('span', 'num', String(i + 1)));
      c.appendChild(document.createTextNode(q));
      c.disabled = state.busy;
      c.addEventListener('click', function () { send(q); });
      els.choices.appendChild(c);
    });
    els.choices.hidden = false;
  }
  function showWelcome() {
    setDialogError(false);
    showPlayerLine('');
    renderChoices([]);
    els.dialogScroll.scrollTop = 0;
    typeInto(els.dialogScroll,
      '<p class="greet">' + esc(GREETING) + '</p><p class="sub">' + esc(GREETING_SUB) + '</p>',
      function () { renderChoices(EXAMPLES); });
    setMood('happy', 1300);
  }
  function showThinking() {
    setDialogError(false);
    renderChoices([]);
    stopTyping(true);
    els.dialog.classList.remove('done');
    els.dialogScroll.innerHTML = '';
    var p = el('p', 'sub');
    var label = el('span', null, '資料を検索しています…');
    p.appendChild(label);
    els.dialogScroll.appendChild(p);
    setMood('thinking');
    var sec = 0;
    var timer = setInterval(function () {
      sec++;
      if (sec === 4) label.textContent = '回答を作成しています…';
      if (sec >= 15) label.textContent = '混み合っています。もう少しお待ちください…';
    }, 1000);
    return { stop: function () { clearInterval(timer); } };
  }

  // 参照元・コピーなど（文字送りが終わってから表示）
  function copyText(text, btn) {
    function done() { var o = btn.textContent; btn.textContent = 'コピーしました'; setTimeout(function () { btn.textContent = o; }, 1500); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { /* 何もしない */ }
      ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }
  function buildSources(sources) {
    if (!sources || !sources.length) return el('div', 'no-src', '※ この回答では、資料からの引用はありませんでした。');
    var det = el('details', 'sources');
    var sum = el('summary');
    sum.appendChild(el('span', 'src-label', '参照元'));
    sources.forEach(function (s) { sum.appendChild(el('span', 'doc-tag', s.doc)); });
    det.appendChild(sum);
    sources.forEach(function (s) {
      var box = el('div', 'src');
      var title = el('div', 'src-title', s.doc);
      var url = safeHttpsUrl(s.url);
      if (url) {
        var a = el('a', null, '原文を開く →');
        a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        title.appendChild(a);
      }
      box.appendChild(title);
      (s.excerpts || []).forEach(function (x) {
        var q = el('blockquote', 'excerpt', x);
        box.appendChild(q);
        if (x.length > 120) {
          var more = el('button', 'more', '続きを表示');
          more.type = 'button';
          more.addEventListener('click', function () {
            var open = q.classList.toggle('expanded');
            more.textContent = open ? '折りたたむ' : '続きを表示';
          });
          box.appendChild(more);
        }
      });
      det.appendChild(box);
    });
    return det;
  }
  function buildExtra(res) {
    var wrap = el('div', 'extra');
    if (res.truncated) wrap.appendChild(el('div', 'notice', '※ 回答が長いため、途中で終わっている可能性があります。質問を分けてお試しください。'));
    wrap.appendChild(buildSources(res.sources));
    var meta = el('div', 'meta');
    if (res.elapsedMs) meta.appendChild(el('span', null, (res.elapsedMs / 1000).toFixed(1) + '秒'));
    if (res.fallback && res.model) meta.appendChild(el('span', null, '混雑のため ' + res.model + ' で回答'));
    meta.appendChild(el('span', 'spacer'));
    var copy = el('button', null, 'コピー');
    copy.type = 'button';
    copy.addEventListener('click', function () { copyText(res.answer, copy); });
    meta.appendChild(copy);
    wrap.appendChild(meta);
    return wrap;
  }
  function showAnswer(res) {
    setDialogError(false);
    setMood('idle');
    els.dialogScroll.scrollTop = 0;
    var html = '<div class="md">' + renderMarkdown(res.answer) + '</div>';   // renderMarkdown は全文字列をエスケープ済み
    typeInto(els.dialogScroll, html, function () {
      els.dialogScroll.appendChild(buildExtra(res));
    });   // 2ターン目以降は選択肢を出さない
  }
  function showError(message, retryQuestion) {
    setDialogError(true);
    renderChoices([]);
    stopTyping(true);
    els.dialogScroll.innerHTML = '';
    els.dialogScroll.appendChild(el('p', 'err', message));
    if (retryQuestion) {
      var btn = el('button', 'retry', 'もう一度送信');
      btn.type = 'button';
      btn.addEventListener('click', function () { if (!state.busy) send(retryQuestion, { retry: true }); });
      els.dialogScroll.appendChild(btn);
    }
    els.dialog.classList.add('done');
    setMood('error', 1000);
  }
  function pokeChara() {
    if (state.busy || state.typing) return;
    setDialogError(false);
    showPlayerLine('');
    renderChoices([]);
    var line = POKE_LINES[Math.floor(Math.random() * POKE_LINES.length)];
    typeInto(els.dialogScroll, '<p class="greet">' + esc(line) + '</p>', function () {
      if (!state.log.length) renderChoices(EXAMPLES);
    });
    setMood('happy', 1200);
  }

  // ===== 会話ログ =====
  function addLog(role, text, res) { state.log.push({ role: role, text: text, res: res }); }
  function openLog() {
    var body = els.logBody;
    body.innerHTML = '';
    if (!state.log.length) body.appendChild(el('p', 'log-empty', 'まだ会話はありません。'));
    state.log.forEach(function (m) {
      var row = el('div', 'log-msg ' + m.role);
      if (m.role === 'bot') {
        var av = el('div', 'log-av'); av.innerHTML = faceSvgInverse();
        var b = el('div', 'log-bubble');
        var md = el('div', 'md'); md.innerHTML = renderMarkdown(m.text);
        b.appendChild(md);
        if (m.res) b.appendChild(buildSources(m.res.sources));
        row.appendChild(av); row.appendChild(b);
      } else {
        row.appendChild(el('div', 'log-bubble', m.text));
      }
      body.appendChild(row);
    });
    els.log.hidden = false;
    body.scrollTop = body.scrollHeight;
    els.logClose.focus();
  }
  function closeLog() { els.log.hidden = true; els.logBtn.focus(); }

  // ===== サーバー呼び出し =====
  function clientId() {
    try {
      var id = localStorage.getItem('chat_cid');
      if (!id) { id = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('chat_cid', id); }
      return id;
    } catch (e) { return ''; }
  }
  function callAsk(payload) {
    if (HAS_GAS) {
      return new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).ask(payload);
      });
    }
    if (GAS_ENDPOINT) {
      payload.clientId = clientId();
      // text/plain にすることで、CORS の事前確認（preflight）なしで GAS に送れる
      return fetch(GAS_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), redirect: 'follow' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    }
    return new Promise(function (resolve) { setTimeout(function () { resolve(previewAnswer()); }, 1200); });
  }
  function previewAnswer() {
    return {
      ok: true, elapsedMs: 1200, model: 'preview', fallback: false,
      answer: '（プレビュー表示です。GAS と接続すると実際の回答が表示されます）\n\n' +
        'お弁当・スイーツ等の商品を指定配達事業者に配達委託する場合、手数料等は **代金（税込）の 28％** です。\n\n' +
        '| 区分 | 手数料等 |\n|---|---|\n| 提供場所まで持参 | 代金（税込）の 8％ |\n| 配達を委託 | 代金（税込）の 28％ |\n\n' +
        '- 配達手数料等を含みます\n- 指定決済代行事業者の手数料は別途です',
      sources: [{ doc: 'みんまちSHOP 出店規約', url: '', excerpts: ['お弁当・スイーツ等の商品 | 乙が指定配達事業者に対し、本件商品等の提供場所までの配達を委託する場合（※配達手数料等を含む） | 代金（税込）の 28％'] }]
    };
  }

  // ===== 送信 =====
  function setBusy(b) {
    state.busy = b;
    updateCounter();
    Array.prototype.forEach.call(els.choices.querySelectorAll('.choice'), function (c) { c.disabled = b; });
    els.resetBtn.disabled = b;
  }
  function send(question, opts) {
    opts = opts || {};
    var q = String(question || '').trim();
    if (!q || state.busy) return;
    if (q.length > MAX_CHARS) { showError('質問は ' + MAX_CHARS + ' 文字以内で入力してください。'); return; }
    showPlayerLine(q);
    if (!opts.retry) addLog('user', q);
    setBusy(true);
    var thinking = showThinking();
    var payload = { question: q, history: state.history.slice(-MAX_HISTORY_TURNS * 2) };
    callAsk(payload).then(function (res) {
      thinking.stop();
      if (res && res.ok) {
        showAnswer(res);
        addLog('bot', res.answer, res);
        state.history.push({ role: 'user', text: q }, { role: 'model', text: res.answer });
        state.history = state.history.slice(-MAX_HISTORY_TURNS * 2);
      } else {
        var retryable = res && ['BUSY', 'API', 'INTERNAL', 'EMPTY'].indexOf(res.code) >= 0;
        showError((res && res.error) || 'エラーが発生しました。', retryable ? q : null);
      }
    }, function (err) {
      thinking.stop();
      console.error(err);
      showError('通信エラーが発生しました。ネットワークを確認して、もう一度お試しください。', q);
    }).then(function () { setBusy(false); });
  }

  // ===== 入力欄 =====
  function autoGrow() {
    els.input.style.height = 'auto';
    els.input.style.height = Math.min(els.input.scrollHeight, 96) + 'px';
  }
  function updateCounter() {
    var val = els.input.value || '', n = val.length;
    els.counter.textContent = n > MAX_CHARS * 0.8 ? n + ' / ' + MAX_CHARS : '';
    els.counter.className = 'counter' + (n > MAX_CHARS ? ' over' : '');
    els.send.disabled = state.busy || !val.trim().length || n > MAX_CHARS;
  }
  function bindComposer() {
    els.form.addEventListener('submit', function (e) {
      e.preventDefault();
      var q = els.input.value;
      if (!q.trim() || state.busy || q.length > MAX_CHARS) return;
      els.input.value = ''; autoGrow(); updateCounter();
      els.input.blur();
      send(q);
    });
    els.input.addEventListener('keydown', function (e) {
      // 日本語変換の確定中（isComposing / keyCode 229）は送信しない
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        els.form.requestSubmit ? els.form.requestSubmit() : els.form.dispatchEvent(new Event('submit', { cancelable: true }));
      }
    });
    ['input', 'keyup', 'change', 'compositionend'].forEach(function (evt) {
      els.input.addEventListener(evt, function () { autoGrow(); updateCounter(); });
    });
    updateCounter();
  }

  function resetGame() {
    if (state.busy) return;
    state.history = []; state.log = [];
    els.input.value = ''; autoGrow(); updateCounter();
    showWelcome();
  }

  // ===== スマホ：表示領域とキーボード対応 =====
  var baseH = 0, lastW = 0;
  function fitViewport() {
    var vv = window.visualViewport;
    var h = vv ? vv.height : window.innerHeight;
    var w = vv ? vv.width : window.innerWidth;
    if (w !== lastW) { baseH = 0; lastW = w; }
    var focused = document.activeElement && document.activeElement.tagName === 'TEXTAREA';
    if (!focused || h > baseH) baseH = Math.max(baseH, h);
    var kb = focused && baseH - h > 120;
    document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
    els.game.style.top = (vv ? Math.max(0, vv.offsetTop) : 0) + 'px';
    document.body.classList.toggle('kb-open', kb);
  }
  function bindViewport() {
    var vv = window.visualViewport;
    if (vv) { vv.addEventListener('resize', fitViewport); vv.addEventListener('scroll', fitViewport); }
    window.addEventListener('resize', fitViewport);
    window.addEventListener('orientationchange', function () { setTimeout(fitViewport, 300); });
    document.addEventListener('focusin', function () { setTimeout(fitViewport, 50); setTimeout(fitViewport, 350); });
    document.addEventListener('focusout', function () { setTimeout(fitViewport, 50); setTimeout(fitViewport, 350); });
    fitViewport();
  }

  // ===== 初期化 =====
  function init() {
    ['game', 'chara', 'dialog', 'nametag', 'dialogScroll', 'choices', 'playerLine', 'playerText', 'input', 'form', 'send',
     'counter', 'log', 'logBody', 'logBtn', 'logClose', 'resetBtn', 'statusState']
      .forEach(function (id) { els[id] = document.getElementById(id); });

    setFavicon();
    els.chara.innerHTML = robotSvg('full');
    els.chara.setAttribute('aria-label', CHARA_ALT);
    els.chara.addEventListener('click', pokeChara);
    // 会話ウィンドウをタップ → 文字送りをスキップ
    els.dialog.addEventListener('click', function (e) {
      if (state.typing && !e.target.closest('button')) stopTyping(true);
    });
    els.logBtn.addEventListener('click', openLog);
    els.logClose.addEventListener('click', closeLog);
    els.log.addEventListener('click', function (e) { if (e.target === els.log) closeLog(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !els.log.hidden) closeLog(); });
    els.resetBtn.addEventListener('click', resetGame);

    bindComposer();
    bindViewport();
    showWelcome();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
</script>
</body>
</html>
